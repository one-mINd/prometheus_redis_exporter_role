---
- name: REDIS EXPORTER | Check container registry type
  assert:
    that: 
      - redis_exporter_type_private_registry in ['yc_cr']
    fail_msg: >
      Invalid redis_exporter_type_private_registry: '{{ redis_exporter_type_private_registry }}'.
      Allowed: 'yc_cr'.
  when: redis_exporter_use_private_registry

- name: REDIS EXPORTER | Create IAM token in registry yc_cr
  ansible.builtin.shell: |
    curl --header Metadata-Flavor:Google 169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token | \
    cut -f1 -d',' | \
    cut -f2 -d':' | \
    tr -d '"' 
  when: redis_exporter_use_private_registry and redis_exporter_type_private_registry == "yc_cr"
  register: yc_cr_registry_token

- name: REDIS EXPORTER | Get IAM token in registry yc_cr
  ansible.builtin.set_fact:
    redis_exporter_yc_cr_registry_token: "{{ yc_cr_registry_token.stdout }}"
  when: redis_exporter_use_private_registry and redis_exporter_type_private_registry == "yc_cr"

- name: REDIS EXPORTER | Login into private docker registry
  community.docker.docker_login:
    registry_url: cr.yandex
    username: iam
    password: "{{ redis_exporter_yc_cr_registry_token }}"
    reauthorize: true
  when: redis_exporter_use_private_registry and redis_exporter_type_private_registry == "yc_cr"

- name: REDIS EXPORTER | Start docker redis exporter container
  community.docker.docker_compose_v2:
    state: present
    project_name: prometheus_redis_exporter
    definition:
      services:
        redis_exporter:
          image: "{{ redis_exporter_docker_image }}:{{ redis_exporter_version }}"
          command: "{{ redis_exporter_options }}"
          container_name: "{{ redis_exporter_container_name }}"
          ports:
            - "{{ redis_exporter_ip }}:{{ redis_exporter_port }}:9121"
          restart: always
      networks:
        default:
          external: true
          name: "{{ redis_exporter_docker_network_name }}"
  when: redis_exporter_swarm_manager is undefined

- name: REDIS EXPORTER | Deploy redis_exporter to docker swarm
  block:
    - name: Ensure pip installation
      package:
        name: "python3-pip"
        state: present

    - name: Install newer version of pip itself
      pip:
        name: "pip"
        state: latest
        executable: pip3
      when:
        - ansible_distribution == "ubuntu"
        - ansible_distribution_major_version != 24

    - name: Install jsondiff from pip
      pip:
        name: "jsondiff"
        state: present
        executable: pip3
      when:
        - ansible_distribution == "ubuntu"
        - ansible_distribution_major_version != 24

    - name: Ensure jsondiff
      package:
        name: "python3-jsondiff"
        state: present
      when:
        - ansible_distribution == "ubuntu"
        - ansible_distribution_major_version == 24

    - name: Deploy redis_exporter docker container in swarm
      community.docker.docker_stack:
        state: present
        name: "{{ redis_exporter_stack_name | default('redis_exporter')}}"
        with_registry_auth: yes
        compose:
          - version: '3.5'
            services: |
              {{
                {
                  item.name: {
                    "image": redis_exporter_docker_image,
                    "hostname": item.name,
                    "labels": redis_exporter_docker_labels | default([]),
                    "environment": item.environment | default([]),
                    "deploy": redis_exporter_swarm_deploy
                  }
                }
              }}
            networks:
              default:
                external:
                  name: "{{ redis_exporter_docker_network_name }}"
      run_once: True
      loop: "{{ redis_exporter_docker_services }}"
  delegate_to: "{{ redis_exporter_swarm_manager }}"
  when: redis_exporter_swarm_manager is defined
